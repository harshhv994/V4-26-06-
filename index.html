<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IITK Campus Simulator v5 - Event Log Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <!-- NEW: The Macro Timeline Progress Bar -->
    <header id="macro-timeline" class="macro-timeline"></header>

    <!-- EXISTING: Your 3-Panel Layout -->
    <main class="three-panel-layout">
        <section id="left-panel">
            <div class="panel-section">
                <h3 class="panel-heading">Character Sheet</h3>
                <div id="survival-stats" class="vertical-stats"></div>
            </div>
            
            <div class="panel-section" style="margin-top: 15px;">
                <h3 class="panel-heading">Resume Tokens</h3>
                <div id="resume-stats" class="vertical-stats"></div>
            </div>

            <hr class="panel-divider">
            
            <div class="panel-section">
                <h2 id="current-phase" style="color: var(--text-main); font-size: 1.2em;">System Booting...</h2>
                <p id="phase-vibe" style="color: var(--text-muted); font-style: italic; margin-top: 10px; font-size: 0.9em; line-height: 1.5;"></p>
            </div>
        </section>

        <section id="center-panel">
            <div id="board-panel">
                <h2>Welcome to IITK</h2>
                <p style="margin-top: 10px; color: var(--text-muted);">Initializing MVC Architecture...</p>
            </div>
        </section>

        <section id="right-panel">
            <div class="panel-section">
                <h3 class="panel-heading">Academic Progress</h3>
                <div id="academic-tracker">
                    <p style="color: var(--text-muted); font-size: 0.85em; font-style: italic;">SPI Math Tracking (Coming Next)</p>
                </div>
            </div>

            <hr class="panel-divider">
            
            <div class="panel-section">
                <h3 class="panel-heading">Your Network</h3>
                <div id="active-connections"></div>
            </div>

            <hr class="panel-divider">
            
            <div class="panel-section" style="flex-grow: 1; display: flex; flex-direction: column;">
                <h3 class="panel-heading">Event Log</h3>
                <div id="event-log" style="overflow-y: auto; flex-grow: 1;"></div>
            </div>
        </section>
    </main>
<footer>
        <div id="time-tracker" style="font-size: 1.2em; font-weight: bold;"></div>
        <div>
            <button id="btn-next-phase" onclick="CampusSimulator.nextPhase()" style="padding: 10px 20px; cursor: pointer; background: var(--accent-blue); color: white; border: none; border-radius: var(--border-radius); font-weight: bold;">Next Phase</button>
        </div>
    </footer>


    <script src="js/state.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/controller.js"></script>
    <script src="js/csvLoader.js"></script>
    <script src="js/game.js"></script>

    
</body>
</html>
