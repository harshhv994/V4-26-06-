<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IITK Campus Simulator v5 - Event Log Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --accent-blue: #4a90e2;
            --accent-red: #f44336;
            --accent-green: #4caf50;
            --accent-purple: #a855f7;
            --accent-gold: #f59e0b;
            --border-radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        
        /* Top Bar: Core Stats & Resume */
        header { background-color: var(--panel-bg); padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; }
        .stat-group { display: flex; gap: 15px; }
        .stat-box { background: #2a2a2a; padding: 5px 15px; border-radius: var(--border-radius); font-weight: bold; }
        
        /* Main Layout: 3 Columns */
        main { display: flex; flex: 1; overflow: hidden; }
        
        #narrative-panel { width: 25%; padding: 20px; background: var(--panel-bg); border-right: 1px solid #333; overflow-y: auto; }
        #board-panel { width: 50%; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        #social-panel { width: 25%; padding: 20px; background: var(--panel-bg); border-left: 1px solid #333; overflow-y: auto; }
        
        /* Footer: Controls & Time Blocks */
        footer { background-color: var(--panel-bg); padding: 15px 20px; display: flex; justify-content: space-between; border-top: 1px solid #333; align-items: center; }
        
        /* Card UI Components */
        .game-card { background: #2a2a2a; border: 1px solid #444; border-radius: var(--border-radius); padding: 15px; width: 100%; text-align: left; transition: transform 0.2s, border-color 0.2s; margin-bottom: 10px; }
        .game-card.clickable { cursor: pointer; }
        .game-card.clickable:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
        .game-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
        .card-cost { color: var(--accent-blue); }
        .card-flavor { font-size: 0.85em; color: var(--text-muted); line-height: 1.4; display: block; margin-top: 5px; }
        .pill-container { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .stat-pill { font-size: 0.75em; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        /* ========== PHASE 1: TAB & GRID STYLES ========== */
        .tabs { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 0; 
        }
        
        .tab-btn { 
            background: none; 
            color: var(--text-muted); 
            border: none; 
            font-size: 1.1em; 
            cursor: pointer; 
            padding: 10px 15px; 
            border-bottom: 2px solid transparent; 
            transition: 0.2s; 
            font-weight: bold; 
        }
        
        .tab-btn:hover { 
            color: var(--text-main); 
        }
        
        .tab-btn.active { 
            color: var(--accent-blue); 
            border-bottom-color: var(--accent-blue); 
        }
        
        .card-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 15px; 
            width: 100%; 
        }
        
        /* Opportunity Cards */
        .opp-card { 
            background: #2a2a2a; 
            border: 1px solid #444; 
            border-radius: var(--border-radius); 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: 0.2s; 
        }
        
        .opp-card:hover { 
            border-color: var(--text-muted); 
        }
        
        .opp-card.locked { 
            opacity: 0.6; 
            border-color: rgba(244, 67, 54, 0.3); 
            background: #1a1a1a; 
        }
        
        .req-pill { 
            font-size: 0.8em; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-weight: bold; 
            display: inline-block; 
            margin-top: 8px; 
            margin-right: 5px; 
            background: rgba(244, 67, 54, 0.1); 
            color: var(--accent-red); 
        }
        
        .req-pill.met { 
            background: rgba(76, 175, 80, 0.1); 
            color: var(--accent-green); 
        }
        
        .draft-btn { 
            margin-top: 15px; 
            padding: 10px; 
            width: 100%; 
            border-radius: 4px; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            background: var(--accent-blue); 
            color: white; 
            transition: 0.2s; 
        }
        
        .draft-btn:hover { 
            background: #357abd; 
        }
        
        .draft-btn:disabled { 
            background: #444; 
            color: #888; 
            cursor: not-allowed; 
        }
    </style>
</head>
<body>

    <header>
        <div class="stat-group" id="survival-stats"></div>
        <div class="stat-group" id="resume-stats"></div>
    </header>

    <main>
        <section id="narrative-panel">
            <h2 id="current-phase">System Booting...</h2>
            <p id="phase-vibe" style="color: var(--text-muted); font-style: italic; margin-top: 10px;"></p>
            <hr style="margin: 20px 0; border-color: #333;">
            <div id="event-log"></div>
        </section>

        <section id="board-panel">
            <h2>Welcome to IITK</h2>
            <p style="margin-top: 10px; color: var(--text-muted);">Initializing MVC Architecture...</p>
        </section>

        <section id="social-panel">
            <h2>Your Network</h2>
            <p style="font-size: 0.9em; color: var(--text-muted); margin-bottom: 15px;">Passive Engine</p>
            <div id="active-connections"></div>
        </section>
    </main>

    <footer>
        <div id="time-tracker" style="font-size: 1.2em; font-weight: bold;"></div>
        <div>
            <button id="btn-next-phase" onclick="CampusSimulator.nextPhase()" style="padding: 10px 20px; cursor: pointer; background: var(--accent-blue); color: white; border: none; border-radius: var(--border-radius); font-weight: bold;">Next Phase</button>
        </div>
    </footer>

    <script>
        // ========== PHASE 0: GAME ENGINE ==========
        const CampusSimulator = (() => {
            // --- 1. CORE DATABASE & PHASE CONSTANTS ---
            const db = {
                timeline: [], friction: [], por: [], intern: [], proj: [], locations: [], placement: [], social: []
            };

            const PHASES = {
                NARRATIVE: 'narrative',
                FRICTION: 'friction',
                OPPORTUNITY: 'opportunity',
                ACTION: 'action'
            };

            // --- 2. GAME STATE ---
            const state = {
                stats: { Health: 100, Stress: 0, Social: 50, Money: 1000, Study: 0, CPI: 0 },
                resume: { Projects: 0, Internships: 0, Positions: 0 },
                turn: 1,
                semester: 1,
                phase: PHASES.NARRATIVE,
                blocksRemaining: 12,
                history: [],
                logs: [],
                activeTab: 'projects'
            };

            // --- 3. UI LAYER (Rendering) ---
            const UI = {
                updateHUD: function(stats, resume, turn, semester, blocks) {
                    document.getElementById('survival-stats').innerHTML = `
                        <div class="stat-box">❤️ Health: ${Math.max(0, stats.Health)}</div>
                        <div class="stat-box">😰 Stress: ${stats.Stress}</div>
                        <div class="stat-box">👥 Social: ${stats.Social}</div>
                        <div class="stat-box">💵 Money: ₹${stats.Money}</div>
                    `;
                    document.getElementById('resume-stats').innerHTML = `
                        <div class="stat-box">📊 Projects: ${resume.Projects}</div>
                        <div class="stat-box">🏢 Internships: ${resume.Internships}</div>
                        <div class="stat-box">🎓 Positions: ${resume.Positions}</div>
                        <div class="stat-box">📈 CPI: ${(stats.CPI || 0).toFixed(2)}</div>
                    `;
                    document.getElementById('time-tracker').innerHTML = `Sem ${semester} | Turn ${turn} | Blocks: ${blocks}`;
                },

                updateEventLog: function(logs) {
                    const logHTML = logs.map(log => {
                        let color = 'var(--text-muted)';
                        if (log.type === 'opportunity') color = 'var(--accent-gold)';
                        if (log.type === 'friction') color = 'var(--accent-red)';
                        if (log.type === 'location') color = 'var(--accent-blue)';

                        let effectsHTML = '';
                        for (const [stat, value] of Object.entries(log.effects)) {
                            const isPositive = value > 0;
                            const sign = isPositive ? '+' : '';
                            
                            let pillColor = 'var(--text-muted)';
                            if (['Health', 'Social', 'Study', 'Money'].includes(stat)) {
                                pillColor = isPositive ? 'var(--accent-green)' : 'var(--accent-red)';
                            } else if (['Stress', 'Time'].includes(stat)) {
                                pillColor = isPositive ? 'var(--accent-red)' : 'var(--accent-green)';
                            }

                            effectsHTML += `<span style="display:inline-block; margin-right: 5px; margin-top: 5px; font-size: 0.75em; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.3); border: 1px solid ${pillColor}; color: ${pillColor}; font-weight: bold;">${sign}${value} ${stat}</span>`;
                        }

                        return `
                            <div style="margin-bottom: 15px; border-left: 3px solid ${color}; padding: 8px 10px; background: rgba(255,255,255,0.02); border-radius: 0 8px 8px 0;">
                                <div style="font-size: 0.75em; color: var(--text-muted); text-transform: uppercase;">Sem ${log.semester} | Turn ${log.turn}</div>
                                <div style="font-size: 1.05em; font-weight: bold; margin-top: 4px; color: ${color};">
                                    ${log.icon} ${log.title}
                                </div>
                                <div>${effectsHTML}</div>
                            </div>
                        `;
                    }).join('');

                    document.getElementById('event-log').innerHTML = logHTML;
                },

                updateNarrativeSidePanel: function(phase, vibe) {
                    document.getElementById('current-phase').textContent = phase;
                    document.getElementById('phase-vibe').textContent = vibe;
                },

                updateBoard: function(html) {
                    document.getElementById('board-panel').innerHTML = html;
                },

                renderNarrative: function(phase, psychology, poetic) {
                    return `<div class="game-card">
                        <h3>${phase}</h3>
                        <p style="margin-top: 10px; line-height: 1.6;">${psychology}</p>
                        <p style="margin-top: 10px; font-style: italic; color: var(--text-muted);">"${poetic}"</p>
                    </div>`;
                },

                renderFriction: function(eventCard) {
                    if (!eventCard) return '<div class="game-card"><p>No friction events for this semester.</p></div>';
                    
                    const costTime = Logic.getSafeInt(eventCard.Cost_Time);
                    const costHealth = Logic.getSafeInt(eventCard.Cost_Health);
                    const costStress = Logic.getSafeInt(eventCard.Cost_Stress);
                    const costSocial = Logic.getSafeInt(eventCard.Cost_Social);
                    const costMoney = Logic.getSafeInt(eventCard.Cost_Money);

                    return `<div class="game-card">
                        <div class="card-header">
                            <span>${eventCard.Name || eventCard.ID}</span>
                            <span class="card-cost">${costTime} blocks</span>
                        </div>
                        <p class="card-flavor">${eventCard.Description || 'A random event affects your semester.'}</p>
                        <div class="pill-container">
                            ${costHealth > 0 ? `<span class="stat-pill" style="background: rgba(244, 67, 54, 0.2); color: var(--accent-red);">-${costHealth} Health</span>` : ''}
                            ${costStress > 0 ? `<span class="stat-pill" style="background: rgba(244, 67, 54, 0.2); color: var(--accent-red);">+${costStress} Stress</span>` : ''}
                            ${costSocial > 0 ? `<span class="stat-pill" style="background: rgba(244, 67, 54, 0.2); color: var(--accent-red);">-${costSocial} Social</span>` : ''}
                            ${costMoney > 0 ? `<span class="stat-pill" style="background: rgba(244, 67, 54, 0.2); color: var(--accent-red);">-₹${costMoney}</span>` : ''}
                        </div>
                    </div>`;
                },

                renderOpportunity: function(tabData, activeTab) {
                    const tabNames = { projects: 'Projects', interns: 'Internships', pors: 'Positions' };
                    return `
                        <h2>Opportunities</h2>
                        <div class="tabs">
                            <button class="tab-btn ${activeTab === 'projects' ? 'active' : ''}" onclick="CampusSimulator.switchTab('projects')">📋 Projects</button>
                            <button class="tab-btn ${activeTab === 'interns' ? 'active' : ''}" onclick="CampusSimulator.switchTab('interns')">🏢 Internships</button>
                            <button class="tab-btn ${activeTab === 'pors' ? 'active' : ''}" onclick="CampusSimulator.switchTab('pors')">🎓 Positions</button>
                        </div>
                        <div class="card-grid">
                            ${tabData.map(item => item.html).join('')}
                        </div>
                    `;
                },

                renderAction: function(locations, blocksRemaining) {
                    return `<div style="width: 100%; max-width: 600px;">
                        <h2>Locations</h2>
                        ${locations.map(loc => {
                            const cost = Logic.getSafeInt(loc.Cost_Time);
                            const isAffordable = blocksRemaining >= cost;
                            return `<div class="game-card ${isAffordable ? 'clickable' : 'disabled'}" onclick="${isAffordable ? `CampusSimulator.takeLocationAction('${loc.ID}')` : ''}" style="cursor: ${isAffordable ? 'pointer' : 'not-allowed'};">
                                <div class="card-header">
                                    <span>${loc.Location_Name}</span>
                                    <span class="card-cost">${cost} blocks</span>
                                </div>
                                <p class="card-flavor">${loc.Description || 'A place to spend time.'}</p>
                            </div>`;
                        }).join('')}
                    </div>`;
                },

                components: {
                    oppCard: function(card, isLocked, isAffordable, reqHTML) {
                        const cost = Logic.getSafeInt(card.Cost_Time);
                        const costHealth = Logic.getSafeInt(card.Cost_Health);
                        const rewardHealth = Logic.getSafeInt(card.Reward_Health);

                        return `
                            <div class="opp-card ${isLocked ? 'locked' : ''}">
                                <div>
                                    <div style="font-weight: bold; font-size: 1.05em;">${card['Card Name'] || card.ID}</div>
                                    <div style="font-size: 0.9em; color: var(--text-muted); margin-top: 5px;">Cost: <span style="color: var(--accent-blue);">${cost} blocks</span></div>
                                    <div style="font-size: 0.85em; margin-top: 8px; line-height: 1.4;">${card.Description || 'An opportunity awaits.'}</div>
                                    ${reqHTML ? `<div>${reqHTML}</div>` : ''}
                                </div>
                                <button class="draft-btn" onclick="CampusSimulator.draftCard('${card.ID}')" ${isLocked || !isAffordable ? 'disabled' : ''}>
                                    ${isLocked ? '🔒 Locked' : !isAffordable ? '❌ Not Enough Time' : '✅ Draft'}
                                </button>
                            </div>
                        `;
                    }
                }
            };

            // --- 4. GAME LOGIC LAYER ---
            const Logic = {
                validateCard: function(card) {
                    return card && card.ID;
                },

                getSafeInt: function(val) {
                    return parseInt(val) || 0;
                },

                addLog: function(resultObject) {
                    if (!resultObject) return;
                    state.logs.unshift(resultObject);
                    if (state.logs.length > 20) state.logs.pop(); // Keep log size manageable
                },

                clampStats: function() {
                    state.stats.Health = Math.max(0, Math.min(state.stats.Health, 200));
                    state.stats.Stress = Math.max(0, Math.min(state.stats.Stress, 200));
                    state.stats.Social = Math.max(0, Math.min(state.stats.Social, 200));
                    state.stats.Money = Math.max(0, state.stats.Money);
                    state.stats.Study = Math.max(0, state.stats.Study);
                },

                deductCosts: function(timeCost) {
                    state.blocksRemaining -= Logic.getSafeInt(timeCost);
                },

                applySurvivalStats: function(card) {
                    state.stats.Health += Logic.getSafeInt(card.Reward_Health) - Logic.getSafeInt(card.Cost_Health);
                    state.stats.Stress += Logic.getSafeInt(card.Cost_Stress) - Logic.getSafeInt(card.Reward_Stress);
                    state.stats.Social += Logic.getSafeInt(card.Reward_Social) - Logic.getSafeInt(card.Cost_Social);
                    state.stats.Money += Logic.getSafeInt(card.Reward_Money) - Logic.getSafeInt(card.Cost_Money);
                },

                applyResumeStats: function(card) {
                    if (card['Card Type'] === 'Project') state.resume.Projects++;
                    if (card['Card Type'] === 'Internship') state.resume.Internships++;
                    if (card['Card Type'] === 'POR') state.resume.Positions++;
                },

                processCardEffect: function(card, actionType = 'neutral') {
                    if (!this.validateCard(card)) return null;

                    const timeCost = this.getSafeInt(card.Cost_Time);
                    this.deductCosts(card.Cost_Time);
                    this.applySurvivalStats(card);
                    this.applyResumeStats(card);
                    this.clampStats();

                    // Calculate net changes for the log
                    const netHealth = this.getSafeInt(card.Reward_Health) - this.getSafeInt(card.Cost_Health);
                    const netStress = this.getSafeInt(card.Reward_Stress) - this.getSafeInt(card.Cost_Stress);
                    const netSocial = this.getSafeInt(card.Reward_Social) - this.getSafeInt(card.Cost_Social);
                    const netMoney  = this.getSafeInt(card.Reward_Money)  - this.getSafeInt(card.Cost_Money);
                    const netStudy  = this.getSafeInt(card.Reward_Study)  - this.getSafeInt(card.Cost_Study);

                    const effects = {};
                    if (timeCost !== 0) effects.Time = -timeCost;
                    if (netHealth !== 0) effects.Health = netHealth;
                    if (netStress !== 0) effects.Stress = netStress;
                    if (netSocial !== 0) effects.Social = netSocial;
                    if (netMoney !== 0) effects.Money = netMoney;
                    if (netStudy !== 0) effects.Study = netStudy;

                    let icon = '📌';
                    if (actionType === 'location') icon = '📍';
                    if (actionType === 'friction') icon = '⚡';
                    if (actionType === 'opportunity') icon = '💼';

                    return {
                        type: actionType,
                        icon: icon,
                        title: card['Card Name'] || card.Location_Name || card.ID,
                        effects: effects,
                        semester: state.semester,
                        turn: state.turn
                    };
                },

                drawRandomFriction: function() {
                    const validEvents = db.friction.filter(e => {
                        const start = parseInt(e.Sem_Start) || 1;
                        const end = parseInt(e.Sem_End) || 8;
                        return state.semester >= start && state.semester <= end;
                    });
                    if (validEvents.length === 0) return null;
                    return validEvents[Math.floor(Math.random() * validEvents.length)];
                },

                calculateEndSemesterCPI: function() {
                    const baseCPI = 7.0;
                    const resumeBonus = (state.resume.Projects * 0.2) + (state.resume.Internships * 0.3) + (state.resume.Positions * 0.1);
                    const stressModifier = state.stats.Stress > 100 ? -0.5 : 0;
                    state.stats.CPI = Math.max(0, Math.min(10, baseCPI + resumeBonus + stressModifier));
                },

                evaluateRequirements: function(reqString) {
                    if (!reqString) return { locked: false, html: '' };
                    
                    let isLocked = false;
                    let html = '';
                    
                    reqString.split(',').forEach(req => {
                        req = req.trim();
                        if (!req) return;
                        
                        let met = false;
                        if (state.history.includes(req)) met = true;

                        if (!met) isLocked = true;
                        html += `<span class="req-pill ${met ? 'met' : ''}">${req}</span>`;
                    });

                    return { locked: isLocked, html: html };
                },

                draftCard: function(cardId, cardData) {
                    if (!this.validateCard(cardData)) return false;
                    
                    // Double check affordability
                    if (state.blocksRemaining < this.getSafeInt(cardData.Cost_Time)) return false;

                    return true;
                }
            };

            // --- 5. PHASE CONTROLLER (The "Traffic Cop") ---
            const Controller = {
                syncHUD: function() {
                    UI.updateHUD(state.stats, state.resume, state.turn, state.semester, state.blocksRemaining);
                    UI.updateEventLog(state.logs);
                },

                startNarrative: function() {
                    const currentData = db.timeline.find(t => t.Turn === state.turn);
                    if (!currentData) {
                        UI.updateBoard(`<h2>Game Over</h2><p>Proceed to Placement Evaluation.</p>`);
                        return;
                    }
                    UI.updateNarrativeSidePanel(`${currentData.Semester}: ${currentData.Phase}`, currentData['the vibe']);
                    UI.updateBoard(UI.renderNarrative(currentData.Phase, currentData['the psychology '], currentData.Poetic));
                },

                startFriction: function() {
                    const eventCard = Logic.drawRandomFriction();
                    if (eventCard) {
                        const result = Logic.processCardEffect(eventCard, 'friction');
                        Logic.addLog(result);
                    }
                    UI.updateBoard(UI.renderFriction(eventCard));
                },

                // PHASE 3: Completely rewritten startOpportunity
                startOpportunity: function() {
                    // 1. Pick the correct database based on the active tab
                    let rawData = [];
                    if (state.activeTab === 'projects') rawData = db.proj;
                    if (state.activeTab === 'interns') rawData = db.intern;
                    if (state.activeTab === 'pors') rawData = db.por;

                    // 2. Filter for current semester (Internships might be 'summer')
                    const availableCards = rawData.filter(c => {
                        if (c.Sem_Start === 'summer') return state.semester % 2 === 0; // Show summers after even sems
                        return state.semester >= (parseInt(c.Sem_Start) || 1);
                    });

                    // 3. Process requirements and build UI data objects
                    const tabData = availableCards.map(card => {
                        const reqEval = Logic.evaluateRequirements(card.Req_Prerequisite);
                        const cost = Logic.getSafeInt(card.Cost_Time);
                        const isAffordable = state.blocksRemaining >= cost;
                        
                        return {
                            id: card.ID,
                            html: UI.components.oppCard(card, reqEval.locked, isAffordable, reqEval.html)
                        };
                    });

                    UI.updateBoard(UI.renderOpportunity(tabData, state.activeTab));
                },

                startAction: function() {
                    // Send UI only the data it needs
                    const validLocs = db.locations.filter(l => (parseInt(l.Sem_Unlocked) || 1) <= state.semester);
                    UI.updateBoard(UI.renderAction(validLocs, state.blocksRemaining));
                },

                advancePhase: function() {
                    switch (state.phase) {
                        case PHASES.NARRATIVE:
                            state.phase = PHASES.FRICTION;
                            this.startFriction();
                            break;
                        case PHASES.FRICTION:
                            state.phase = PHASES.OPPORTUNITY;
                            this.startOpportunity();
                            break;
                        case PHASES.OPPORTUNITY:
                            state.phase = PHASES.ACTION;
                            this.startAction();
                            break;
                        case PHASES.ACTION:
                            Logic.calculateEndSemesterCPI();
                            state.phase = PHASES.NARRATIVE;
                            state.turn++;
                            state.semester = state.turn; // Assuming 1 turn = 1 sem for now
                            state.blocksRemaining = 12;
                            this.startNarrative();
                            break;
                    }
                    this.syncHUD();
                },

                handleLocationClick: function(locId) {
                    const loc = db.locations.find(l => l.ID === locId);
                    if (!loc || state.blocksRemaining < Logic.getSafeInt(loc.Cost_Time)) return;
                    
                    const result = Logic.processCardEffect(loc, 'location');
                    Logic.addLog(result);
                    
                    this.startAction(); 
                    this.syncHUD();
                },

                // PHASE 3: New tab switching handler
                handleTabSwitch: function(tabName) {
                    state.activeTab = tabName;
                    this.startOpportunity(); // Re-render the UI with the new tab
                },

                // PHASE 3: New draft click handler
                handleDraftClick: function(cardId) {
                    // Search all databases to find the card
                    const card = db.proj.find(c => c.ID === cardId) || 
                                 db.intern.find(c => c.ID === cardId) || 
                                 db.por.find(c => c.ID === cardId);
                    
                    if (Logic.draftCard(cardId, card)) {
                        const result = Logic.processCardEffect(card, 'opportunity');
                        Logic.addLog(result);
                        state.history.push(card.ID);
                        
                        this.startOpportunity(); 
                        this.syncHUD();
                    }
                }
            };

            // --- 6. INITIALIZATION & DATA LOADING ---
            function loadCSV(filename) {
                return new Promise((resolve, reject) => {
                    Papa.parse(filename, {
                        download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
                        complete: (results) => resolve(results.data),
                        error: (err) => reject(err)
                    });
                });
            }

            async function initGame() {
                try {
                    const [tl, fric, por, intern, proj, loc, place, soc] = await Promise.all([
                        loadCSV('timeline_population_-_timeline_(2).csv'),
                        loadCSV('timeline_population_-_Friction_Events_(1).csv'),
                        loadCSV('timeline_population_-_POR_(1).csv'),
                        loadCSV('timeline_population_-_intern.csv'),
                        loadCSV('timeline_population_-_proj_(1).csv'),
                        loadCSV('timeline_population_-_loc_(2).csv'),
                        loadCSV('timeline_population_-_placement_(1).csv'),
                        loadCSV('Social_Connect.csv')
                    ]);

                    db.timeline = tl; db.friction = fric; db.por = por; db.intern = intern;
                    db.proj = proj; db.locations = loc; db.placement = place; db.social = soc;

                    Controller.startNarrative();
                    Controller.syncHUD();

                } catch (error) {
                    UI.updateBoard(`<h2 style="color:var(--accent-red)">Failed to load databases.</h2><p>${error.message}</p>`);
                }
            }

            // --- 7. EXPOSE PUBLIC API ---
            // These are the only functions the HTML buttons are allowed to call!
            return {
                boot: initGame,
                nextPhase: function() { Controller.advancePhase(); },
                takeLocationAction: function(locId) { Controller.handleLocationClick(locId); },
                switchTab: function(tabName) { Controller.handleTabSwitch(tabName); },
                draftCard: function(cardId) { Controller.handleDraftClick(cardId); }
            };

        })();

        // Boot the engine when the window loads
        window.onload = CampusSimulator.boot;
    </script>
</body>
</html>
